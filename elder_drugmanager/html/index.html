<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="progress-bar" style="opacity:0; display:none;">
        <div id="progress-track">
            <div id="progress-fill"></div>
            <span id="progress-text">Loading...</span>
        </div>
    </div>
    <div id="captcha-container" style="display:none;">
        <div id="captcha-box">
            <div id="captcha-title">Verification</div>
            <div id="captcha-prompt">Click the <b>🍌 banana</b></div>

            <div id="captcha-grid"></div>
        </div>
    </div>

</body>


</html>

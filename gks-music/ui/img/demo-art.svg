<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Cover art">
    <defs>
        <linearGradient id="bed" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#2A1148" />
            <stop offset="0.5" stop-color="#180C2C" />
            <stop offset="1" stop-color="#0C0616" />
        </linearGradient>

        <radialGradient id="glow" cx="50%" cy="42%" r="52%">
            <stop offset="0" stop-color="#E040FB" stop-opacity="0.62" />
            <stop offset="0.45" stop-color="#8B5CF6" stop-opacity="0.28" />
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
        </radialGradient>

        <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
            <circle cx="4.5" cy="4.5" r="1.05" fill="#FFFFFF" fill-opacity="0.08" />
        </pattern>
    </defs>

    <rect width="600" height="600" fill="url(#bed)" />
    <rect width="600" height="600" fill="url(#glow)" />

    <g stroke="#FFFFFF" fill="none">
        <circle cx="300" cy="278" r="196" stroke-opacity="0.10" stroke-width="1.5" />
        <circle cx="300" cy="278" r="154" stroke-opacity="0.14" stroke-width="1.5" />
        <circle cx="300" cy="278" r="112" stroke-opacity="0.18" stroke-width="1.5" />
        <circle cx="300" cy="278" r="70" stroke-opacity="0.24" stroke-width="1.5" />
        <circle cx="300" cy="278" r="30" stroke-opacity="0.34" stroke-width="2" />
    </g>

    <rect width="600" height="600" fill="url(#dots)" />
</svg>
